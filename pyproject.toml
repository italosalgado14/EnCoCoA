[project]
name = "encocoa"
version = "0.1.0"
description = "Local English-conversation transcriber and coach for two speakers."
readme = "INSTRUCTIONS.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Italo Salgado" }]
dependencies = [
    "faster-whisper>=1.2.1",
    "language-tool-python>=2.8",
    "numpy>=2.4.4",
    "resemblyzer>=0.1.4",
    "scikit-learn>=1.8.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]

[project.scripts]
encocoa = "encocoa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/encocoa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
